<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Storefront workspace</title>
  <link rel="stylesheet" href="/styles/storefront.css">
  <link rel="stylesheet" href="/admin/admin.css">
  <script type="module" src="/manage/workspaces.js"></script>
</head>
<body>
<main class="shell admin">
  <header class="admin-header"><h1>Manage your shops</h1></header>
  <p id="notice" role="status"></p>
  <form id="sign-in" class="panel" hidden>
    <h2>Sign in with email</h2>
    <label>Email <input name="email" type="email" autocomplete="email" required></label>
    <button type="submit">Send sign-in code</button>
  </form>
  <form id="verify" class="panel" hidden>
    <h2>Enter your code</h2>
    <label>Email code <input name="code" inputmode="numeric" autocomplete="one-time-code" required></label>
    <button type="submit">Sign in</button>
    <button type="button" id="change-email">Use another email</button>
  </form>
  <section id="workspace" hidden>
    <div class="admin-header"><h2>Your storefronts</h2><button id="sign-out" type="button">Sign out</button></div>
    <div class="admin-layout">
      <div id="shops" class="panel"></div>
      <form id="shop" class="panel">
        <h2 id="shop-heading">Create a storefront</h2>
        <label>Shop name <input name="name" maxlength="100" required></label>
        <label id="slug-field">Shop URL name <input name="slug" minlength="3" maxlength="48" pattern="[a-z0-9]+(-[a-z0-9]+)*" placeholder="my-shop" required></label>
        <label>Description <textarea name="description" maxlength="300"></textarea></label>
        <label>Public WhatsApp number <input name="whatsapp" type="tel" placeholder="+234…"></label>
        <label id="publish-field" class="check" hidden><input name="published" type="checkbox"> Publish storefront</label>
        <button type="submit" class="primary">Save storefront</button>
      </form>
    </div>
  </section>
</main>
</body>
</html>
